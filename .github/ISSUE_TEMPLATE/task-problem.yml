name: Task or installation problem
description: Report a reproducible problem with a task, installation or helper.
title: "[Problem] "
body:
  - type: input
    id: version
    attributes:
      label: Skill version and client
      description: Commit or installed version, client and model when available.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal task or command
      description: Include only shareable inputs. Remove customer data and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and reproduction
      description: Relevant output, steps and what remains unknown.
    validations:
      required: true
